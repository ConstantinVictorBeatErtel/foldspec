[project]
name = "foldspec"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cadquery>=2.5,<3",
  "fastapi>=0.115,<1",
  "openai>=1.75,<3",
  "pydantic>=2.10,<3",
  "python-dotenv>=1,<2",
  "reportlab>=4,<5",
  "trimesh>=4,<5",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
